name: Package (macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - v0.8.3

jobs:
  package-mac:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package Electron app (macOS)
        run: npm run pack

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: pregonero-mac
          path: release/*.zip
