<!doctype html><meta charset="utf-8"><title>shell</title>
<body style="font:14px system-ui;padding:1rem;margin:0">
<h3>shell (top level)</h3>
<div id="where"></div>
<iframe id="frame" style="width:100%;height:70vh;border:1px solid #999"></iframe>
<script>
  document.getElementById('where').textContent = location.href
  const u = new URLSearchParams(location.search).get('frame')
  if (u) document.getElementById('frame').src = u
</script>
